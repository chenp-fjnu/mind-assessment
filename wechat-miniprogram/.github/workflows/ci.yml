name: CI

on:
  push:
    paths:
      - 'wechat-miniprogram/**'
  pull_request:
    paths:
      - 'wechat-miniprogram/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wechat-miniprogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: wechat-miniprogram/package-lock.json
      - run: npm install
      - name: Lint（非零即失败）
        run: npm run lint
      - name: 冒烟 + Jest 单元/页面测试 + 覆盖率
        run: npm run test:all
