name: miniprogram-tests

on:
  push:
    paths:
      - 'wechat-miniprogram/**'
  pull_request:
    paths:
      - 'wechat-miniprogram/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: 运行评分链路冒烟测试
        working-directory: wechat-miniprogram
        run: node test/smoke.js
